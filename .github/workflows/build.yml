name: Build Builder Helper APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Клонирование репозитория
      uses: actions/checkout@v5

    - name: 2. Настройка Java (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 3. Инициализация Gradle Wrapper
      run: gradle wrapper

    - name: 4. Права на исполнение
      run: chmod +x gradlew

    - name: 5. Компиляция Debug APK
      run: ./gradlew assembleDebug

    - name: 6. Выгрузка собранного APK
      uses: actions/upload-artifact@v4
      with:
        name: BuilderHelper-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
