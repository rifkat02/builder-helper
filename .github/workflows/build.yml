name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Клонирование репозитория
      uses: actions/checkout@v4

    - name: 2. Настройка Java (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Загрузка и установка Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: 4. Создание конфигурации SDK
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: 5. Сборка Debug APK напрямую
      run: gradle assembleDebug

    - name: 6. Сохранение готового APK
      uses: actions/upload-artifact@v4
      with:
        name: BuilderHelper-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
