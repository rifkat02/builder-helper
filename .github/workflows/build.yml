name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Клонирование репозитория
      uses: actions/checkout@v4

    - name: 2. Настройка Java (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Установка Gradle в систему
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: 4. Сборка Debug APK
      run: gradle assembleDebug

    - name: 5. Сохранение готового APK
      uses: actions/upload-artifact@v4
      with:
        name: BuilderHelper-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
